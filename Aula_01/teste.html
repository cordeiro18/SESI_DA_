<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTURO?</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #d9d9da;
            color: white;
            text-align: center;
            padding: 50px;
        }

        main {
            padding: 30px;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(192, 28, 28, 0.1);
        }

        h2 {
            color: #1a73e8;
        }

        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0b5394;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>ESTUDAR DÁ FUTURO?</h1>
    </header>

    <main>

        <section>
            <h2>hora do descanso</h2>
            <p>toda hora é hora de descansar .</p>
        </section>

        <section>
            <h2>AULA</h2>
            <p>Nois estuda muinto..</p>
        </section>

        <section>
            <h2>Aperta o bagulho aí</h2>
            <p>Clique no botão para ver uma mensagem:</p>
            <button onclick="mostrarMensagem()">ME CRICA</button>
        </section>

    </main>

    <footer>
        <p>TRABALHO CORDEIRO</p>
    </footer>

    <script>
        function mostrarMensagem() {
            alert("PROFESSOR GUILHERME É VIADO? ");
        }
    </script>

</body>
</html>
