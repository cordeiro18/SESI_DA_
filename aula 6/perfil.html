<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Petshop</title>
    
      <link rel="stylesheet" href="/aula 6/perfi.css">
    <link rel="shortcut icon" href="./img/icone02.png" type="image/x-icon">

</head>

<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar__brand">
                <img src="./img/feio2.webp" alt="Avatar" class="avatar">
                <span class="brand-name">petshop</span>
            </div>

            <nav class="menu" aria-label="Menu principal">
                <ul>
                    <li class="menu-item active">
                        <span class="icon" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z"
                                    stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M4 22C4 17.5817 7.58172 14 12 14C16.4183 14 20 17.5817 20 22" stroke="#fff"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </span>
                        <span class="label">Perfil</span>
                    </li>
                    <li class="menu-item">
                        <span class="icon" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M20.84 4.61C20.329 4.099 19.722 3.693 19.051 3.418C18.38 3.143 17.657 3.007 16.93 3.017C15.759 3.032 14.631 3.515 13.77 4.378L12 6.15L10.23 4.379C9.368 3.517 8.241 3.033 7.07 3.018C6.342 3.007 5.62 3.143 4.948 3.419C4.277 3.694 3.669 4.1 3.16 4.61C1.59 6.18 1.59 8.82 3.16 10.39L12 19.23L20.84 10.39C22.41 8.82 22.41 6.18 20.84 4.61Z"
                                    stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </span>
                        <span class="label">Favoritos</span>
                    </li>
                    <li class="menu-item">
                        <span class="icon" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M20 7H4V19C4 20.1046 4.89543 21 6 21H18C19.1046 21 20 20.1046 20 19V7Z"
                                    stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M16 3H8V7H16V3Z" stroke="#fff" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </span>
                        <span class="label">Lojas</span>
                    </li>
                    <li class="menu-item">
                        <span class="icon" aria-hidden="true">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M21 9V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V9"
                                    stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                <path d="M21 9L12 15L3 9" stroke="#fff" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" />
                                <path d="M7 9V5C7 3.89543 7.89543 3 9 3H15C16.1046 3 17 3.89543 17 5V9" stroke="#fff"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </span>
                        <span class="label">Pagamento</span>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <button type="button" class="btn-logout">
                    <span>Sair</span>
                    <span class="icon-arrow" aria-hidden="true">→</span>
                </button>
            </div>
        </aside>

        <main class="content">
            <header class="content__header">
                <h1>EDITAR SEU PERFIL</h1>
            </header>

            <section class="profile">
                <div class="profile__photo">
                    <img src="./img/feio2.webp" alt="Foto de perfil">
                </div>

                <h2>PERFIL</h2>

                <form class="profile-form" novalidate>
                    <div class="field">
                        <label for="firstName">Name</label>
                        <input id="firstName" type="text" placeholder="Name">
                    </div>

                    <div class="field">
                        <label for="lastName">Sobrenome</label>
                        <input id="lastName" type="text" placeholder="Sobrenome">
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" type="email" placeholder="Email">
                    </div>

                    <div class="field field--password">
                        <label for="password">Senha</label>
                        <div class="input-group">
                            <input id="password" type="password" placeholder="Senha">
                            <button type="button" class="icon-button" aria-label="Mostrar senha">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                    xmlns="http://www.w3.org/2000/svg">
                                    <path d="M1 12C1 12 5 4 12 4C19 4 23 12 23 12C23 12 19 20 12 20C5 20 1 12 1 12Z"
                                        stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                    <path
                                        d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z"
                                        stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </form>
            </section>
        </main>
    </div>
</body>

</html>
