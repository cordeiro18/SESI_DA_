<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#153f36">
    <title>Entrar | DogMania</title>
    <link rel="stylesheet" href="styles.css">
    <script src="login.js" defer></script>
</head>
<body class="login-page">
    <main class="login-shell">
        <a class="brand login-brand" href="/login">
            <span class="brand-icon" aria-hidden="true">🐾</span>
            <span class="brand-copy"><strong>DogMania</strong><small>CLÍNICA VETERINÁRIA</small></span>
        </a>
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-intro">
                <p class="eyebrow">BEM-VINDO À DOGMANIA</p>
                <h1 id="login-title">Acesse sua conta</h1>
                <p>Entre para acompanhar o cuidado e a saúde dos seus pets.</p>
            </div>

            <form id="form-login" class="auth-form">
                <div class="field">
                    <label for="login-email">E-mail</label>
                    <input id="login-email" name="email" type="email" autocomplete="username"
                           placeholder="voce@email.com" required>
                </div>
                <div class="field">
                    <label for="login-senha">Senha</label>
                    <div class="password-field">
                        <input id="login-senha" name="senha" type="password" autocomplete="current-password"
                               placeholder="Sua senha" required>
                        <button class="password-toggle" type="button" data-password-toggle="login-senha"
                                aria-label="Mostrar senha">Mostrar</button>
                    </div>
                </div>
                <button class="auth-submit" type="submit">Entrar <span aria-hidden="true">→</span></button>
                <p class="mensagem" id="mensagem-login" role="status" aria-live="polite"></p>
            </form>

            <form id="form-cadastro-cliente" class="auth-form escondido">
                <div class="form-grid">
                    <div class="field">
                        <label for="cadastro-nome">Nome completo</label>
                        <input id="cadastro-nome" name="nome" autocomplete="name" required>
                    </div>
                    <div class="field">
                        <label for="cadastro-email">E-mail</label>
                        <input id="cadastro-email" name="email" type="email" autocomplete="email" required>
                    </div>
                    <div class="field">
                        <label for="cadastro-telefone">Telefone</label>
                        <input id="cadastro-telefone" name="telefone" type="tel" autocomplete="tel" required>
                    </div>
                    <div class="field">
                        <label for="cadastro-cpf">CPF</label>
                        <input id="cadastro-cpf" name="cpf" inputmode="numeric" autocomplete="off"
                               placeholder="000.000.000-00" required>
                    </div>
                    <div class="field field-full">
                        <label for="cadastro-senha">Senha (mínimo 12 caracteres)</label>
                        <div class="password-field">
                            <input id="cadastro-senha" name="senha" type="password" autocomplete="new-password"
                                   minlength="12" required>
                            <button class="password-toggle" type="button" data-password-toggle="cadastro-senha"
                                    aria-label="Mostrar senha">Mostrar</button>
                        </div>
                    </div>
                </div>
                <button class="auth-submit" type="submit">Criar conta de cliente <span aria-hidden="true">→</span></button>
                <p class="mensagem" id="mensagem-cadastro" role="status" aria-live="polite"></p>
            </form>

            <p class="auth-switch">
                <span id="texto-alternar">Ainda não tem uma conta?</span>
                <button id="alternar-formulario" type="button">Criar conta de cliente</button>
            </p>
            <p class="login-footnote">Funcionários: use as credenciais fornecidas pela administração da clínica.</p>
        </section>
        <p class="login-footer">Cuidado de verdade para quem faz parte da família.</p>
    </main>
</body>
</html>
